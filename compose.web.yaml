services:
  anki:
    container_name: anki
    build: .
    stdin_open: true
    tty: true
    read_only: true
    environment:
      WEB_UI: "1"
      DEBUG: ${DEBUG:-0}
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    tmpfs:
      - /tmp
      - /home/anki:uid=1000,gid=1000,mode=700
      - /data:uid=1000,gid=1000,mode=700
    networks:
      - internal
    volumes:
      - ./encrypted-volume:/volume
    depends_on:
      - relay

  relay:
    image: alpine/socat
    command: TCP-LISTEN:6080,fork,reuseaddr TCP:anki:6080
    ports:
      - "127.0.0.1:6080:6080"
    networks:
      - internal
      - default

networks:
  internal:
    internal: true

services:
  anki:
    build: .
    stdin_open: true
    tty: true
    read_only: true
    network_mode: none
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    tmpfs:
      - /tmp
      - /home/anki:uid=1000,gid=1000,mode=700
      - /data:uid=1000,gid=1000,mode=700
    volumes:
      - ./encrypted-volume:/volume
      - /tmp/.X11-unix:/tmp/.X11-unix
